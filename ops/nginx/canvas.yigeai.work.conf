server {
    listen 80;
    server_name canvas.yigeai.work;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name canvas.yigeai.work;

    ssl_certificate /etc/letsencrypt/live/canvas.yigeai.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.yigeai.work/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:__CANVAS_PORT__;
    }
}
