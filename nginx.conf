server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # 保持本地 Vite 代理的三条 YigeAI 入口，生产环境由画布容器同源转发，
    # 不修改 api.yigeai.work 的服务、路由、密钥或计费配置。
    location = /api/yigeai {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work;
    }

    location ^~ /api/yigeai/ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work/;
    }

    location = /yigeai-api {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work;
    }

    location ^~ /yigeai-api/ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work/;
    }

    location = /yigeai-text-api {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work;
    }

    location ^~ /yigeai-text-api/ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.yigeai.work;
        proxy_set_header Host api.yigeai.work;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_pass https://api.yigeai.work/;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /build-info.json {
        add_header Cache-Control "no-store";
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
