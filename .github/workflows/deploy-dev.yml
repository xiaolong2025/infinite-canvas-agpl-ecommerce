name: Deploy develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: infinite-canvas-develop
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/infinite-canvas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bun run typecheck

      - name: Install server type dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Typecheck server
        working-directory: server
        run: bun run typecheck

      - name: Test server
        working-directory: server
        run: bun test

      - name: Build web
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bun run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve image reference
        shell: bash
        run: echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push user image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.IMAGE_NAME }}:dev
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=canvas-develop-amd64
          cache-to: type=gha,mode=max,scope=canvas-develop-amd64

      - name: Report build
        shell: bash
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Image: ${{ steps.image.outputs.ref }}"
          echo "The NovixLink host polls the dev tag and deploys this immutable SHA."
